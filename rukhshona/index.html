<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Мамин тонус</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app, sticky top bar + bottom tab bar; plum accent, sage for "safe/good" */
:root{
  --bg:#F4F5F2; --fig:#2B3532; --fig-far:#A9B2AD; --prop:#B4BCB6; --skin:#E2AE8C; --hair:#3B2A22; --top:#B4568F; --legs:#2F3B45; --mat:#D9E4DD; --surface:#FFFFFF; --surface2:#ECEEE9; --fg:#1E2624; --muted:#5B6662;
  --line:#DCE0DA; --accent:#7A3A63; --accent-ink:#FFFFFF; --accent-soft:#F3E6EE;
  --sage:#3F6B57; --sage-soft:#E2EEE7; --warn:#9A5B12; --warn-soft:#FBEFD9; --stop:#A3302A; --stop-soft:#FBE3E1;
  --display:"Unbounded","Manrope",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --fig:#DCE3DF; --fig-far:#58625E; --prop:#56605C; --skin:#E2AE8C; --hair:#1A120E; --top:#D27AB0; --legs:#8C9BA8; --mat:#2C3A33; --surface:#1B2120; --surface2:#232A28; --fg:#EEF1EE; --muted:#A3ADA9;
  --line:#2F3835; --accent:#E2A3CA; --accent-ink:#2A1022; --accent-soft:#3A2333;
  --sage:#8CC5A8; --sage-soft:#1F3229; --warn:#E9B66B; --warn-soft:#3A2C14; --stop:#F0918B; --stop-soft:#3D1F1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --fig:#DCE3DF; --fig-far:#58625E; --prop:#56605C; --skin:#E2AE8C; --hair:#1A120E; --top:#D27AB0; --legs:#8C9BA8; --mat:#2C3A33; --surface:#1B2120; --surface2:#232A28; --fg:#EEF1EE; --muted:#A3ADA9;
  --line:#2F3835; --accent:#E2A3CA; --accent-ink:#2A1022; --accent-soft:#3A2333;
  --sage:#8CC5A8; --sage-soft:#1F3229; --warn:#E9B66B; --warn-soft:#3A2C14; --stop:#F0918B; --stop-soft:#3D1F1D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.figcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 12px 12px}
.fig{display:block;width:100%;height:auto;max-height:260px}
.figwrap{display:flex;flex-direction:column;gap:6px}
.figlbl{margin:0;text-align:center;font-weight:700;font-size:15px;color:var(--muted);min-height:22px;transition:color .3s}
.figlbl.on{color:var(--accent)}
.thumb .figwrap{width:72px;height:46px;display:grid;place-items:center}
.thumb{width:72px;height:46px;border-radius:12px;background:var(--surface2);overflow:hidden;display:grid;place-items:center}
.thumb .fig{width:72px;height:46px}
.ex.ex-t{grid-template-columns:72px 1fr auto}
.thumb img{width:72px;height:46px;object-fit:cover;display:block}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.photos.one{grid-template-columns:1fr}
.photos figure{margin:0;position:relative;border-radius:16px;overflow:hidden;background:var(--surface2);aspect-ratio:3/2;max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos figcaption{position:absolute;left:8px;top:8px;background:rgba(20,24,23,.72);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.photo-note{font-size:13px;color:var(--muted);margin-top:6px}
.small-media{max-width:340px;margin:0 auto;width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.3px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.2;letter-spacing:-.5px}
h2{font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:-.2px}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-l{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border-radius:20px;padding:18px;border:1px solid var(--line)}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--fg)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.sage{background:var(--sage-soft);color:var(--sage)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.btn.block{width:100%}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12px;font-weight:600;min-height:52px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{color:inherit;opacity:.8}
.hero h1{font-size:24px}
.hero .btn{background:var(--accent-ink);color:var(--accent)}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap}
.hero .meta span{background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
:root[data-theme="dark"] .hero .meta span{background:rgba(0,0,0,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero .meta span{background:rgba(0,0,0,.12)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.day b{font-size:13px}
.day .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.day.done .dot{background:var(--sage)}
.day.today{border-color:var(--accent);border-width:2px}
.ex-list{display:flex;flex-direction:column}
.ex{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .n{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.ex .t{min-width:0}
.ex .t b{display:block;font-size:15px}
.ex .t span{font-size:13px;color:var(--muted)}
.ex .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.block-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);padding-top:14px}
.note{border-radius:16px;padding:14px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note svg{flex:none;width:20px;height:20px;margin-top:1px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.stop{background:var(--stop-soft);color:var(--stop)}
.note.sage{background:var(--sage-soft);color:var(--sage)}
.note p,.note li{color:var(--fg)}
.note strong{color:inherit}
/* onboarding */
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--fg);min-height:52px}
.opt b{display:block;font-size:15px}
.opt span{display:block;font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.progress{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=number],input[type=date],select{font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
/* player */
.player{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.player .wrap{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;flex:1}
.timer{font-family:var(--display);font-weight:700;font-size:46px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums;text-align:center}
.ring{position:relative;width:176px;height:176px;margin:0 auto;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .lbl{position:absolute;bottom:42px;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.player.rest{background:var(--sage-soft)}
.ctrl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;margin-top:auto}
.icon-btn{min-height:52px;border-radius:999px;border:0;background:var(--surface2);color:var(--fg);display:grid;place-items:center}
.icon-btn svg{width:24px;height:24px}
details.k{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 16px}
details.k summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.k summary::-webkit-details-marker{display:none}
details.k summary::after{content:"+";font-size:22px;color:var(--muted);font-weight:500}
details.k[open] summary::after{content:"−"}
details.k .body{padding-bottom:16px;display:flex;flex-direction:column;gap:10px;font-size:15px}
details.k ul,details.k ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
table.log{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.log td,table.log th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
table.log th{font-size:12px;color:var(--muted);font-weight:700;border-top:0}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;min-height:40px;font-weight:700;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

<div class="app" id="app"></div>

</nav>

<script>
(function(){
"use strict";
/* ---------- storage ---------- */
const KEY="mamin-tonus-v1";
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const DEFAULT={profile:null,done:{},log:[],tab:"today"};
let S=Object.assign({},DEFAULT,load()||{});
if(!S.done)S.done={}; if(!S.log)S.log=[];

/* ---------- exercise library ----------
 cat: breath | pelvic | posture | core | tone | stretch
 ph: minimum phase (0..3); maxPh: hide from this phase on (simpler versions)
 mode: time (work sec) | reps; side: per side; unsafeDR: avoid with diastasis/doming
 minW: minimum weeks after birth (natural), csW: minimum weeks after C-section */
const EX=[
 {id:"b360",cat:"breath",ph:0,name:"Дыхание 360°",sub:"Основа восстановления пресса и тазового дна",mode:"time",work:60,sets:1,rest:10,
  cues:["Лёжа на спине, колени согнуты, ладони на нижних рёбрах.","Вдох носом: рёбра расходятся в стороны и назад, живот мягко наполняется.","Выдох через губы трубочкой: живот и рёбра мягко «собираются» к центру.","Плечи и шея расслаблены, без усилия."]},
 {id:"kegel",cat:"pelvic",ph:0,name:"Тазовое дно на выдохе",sub:"Медленные и быстрые сжатия",mode:"reps",reps:10,sets:2,rest:20,tempo:6,
  cues:["Вдох — расслабьте низ живота и промежность.","Выдох — мягко сожмите и подтяните мышцы, как будто сдерживаете мочеиспускание и газы.","Удержите 3–5 секунд, затем полностью расслабьте (это так же важно, как сжатие).","Последние 5 повторов — быстрые: сжать-отпустить.","Ягодицы и бёдра не напрягаются, дыхание не задерживается."]},
 {id:"tva",cat:"core",ph:0,name:"Активация глубокой мышцы живота",sub:"Поперечная мышца — «внутренний корсет»",mode:"reps",reps:10,sets:2,rest:20,tempo:6,
  cues:["Лёжа на спине, колени согнуты.","На выдохе подтяните тазовое дно, затем мягко втяните низ живота к позвоночнику (на 30% усилия).","Удержите 5 секунд, продолжая дышать.","Поясница остаётся в нейтральном положении, не вдавливайте её в пол."]},
 {id:"tilt",cat:"core",ph:0,maxPh:2,name:"Наклоны таза лёжа",sub:"Мягкая подвижность поясницы",mode:"reps",reps:12,sets:1,rest:15,tempo:3,
  cues:["Лёжа на спине, колени согнуты.","На выдохе мягко подкрутите таз, прижимая поясницу к полу.","На вдохе верните таз в исходное положение.","Движение маленькое и медленное."]},
 {id:"heel",cat:"core",ph:0,maxPh:2,name:"Скольжение пяткой",sub:"Пресс работает, пока нога движется",mode:"reps",reps:8,sets:2,rest:20,tempo:4,side:true,
  cues:["Лёжа на спине, колени согнуты, на выдохе активируйте глубокую мышцу живота.","Медленно скользите одной пяткой по полу, выпрямляя ногу.","На вдохе верните ногу. Таз не качается.","Следите за животом: если по центру появляется «гребень» — уменьшите амплитуду."]},
 {id:"bridge",cat:"core",ph:0,minW:2,csW:4,name:"Ягодичный мост",sub:"Ягодицы и задняя поверхность — опора для спины",mode:"reps",reps:12,sets:2,rest:30,tempo:4,
  cues:["Лёжа на спине, стопы на ширине таза.","Выдох: подтяните тазовое дно и поднимите таз до прямой линии плечи–колени.","Наверху сожмите ягодицы на 2 секунды, не прогибайте поясницу.","Вдох: медленно опуститесь."]},
 {id:"march",cat:"core",ph:1,maxPh:2,name:"Марш лёжа",sub:"Устойчивость таза",mode:"reps",reps:8,sets:2,rest:20,tempo:4,side:true,
  cues:["Лёжа на спине, колени согнуты, пресс мягко активирован.","На выдохе поднимите одну согнутую ногу до 90° в бедре.","Опустите на вдохе, затем другая нога.","Поясница и таз неподвижны."]},
 {id:"deadbug1",cat:"core",ph:1,maxPh:3,name:"Мёртвый жук — только ноги",sub:"Безопасный пресс при диастазе",mode:"reps",reps:6,sets:2,rest:30,tempo:5,side:true,
  cues:["Лёжа на спине, обе ноги подняты, колени согнуты под 90°, руки вверх.","На выдохе медленно коснитесь пяткой пола, затем верните.","Поясница не отрывается от пола, рёбра «закрыты».","Если живот выпирает «домиком» — делайте с одной ногой на полу."]},
 {id:"deadbug2",cat:"core",ph:2,name:"Мёртвый жук",sub:"Противоположные рука и нога",mode:"reps",reps:8,sets:3,rest:30,tempo:5,side:true,

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
function weeksSince(dateStr){if(!dateStr)return null;const d=new Date(dateStr+"T00:00:00");return Math.max(0,Math.floor((Date.now()-d)/(7*864e5)))}
function fmtDur(sec){const m=Math.round(sec/60);return m<1?"<1 мин":m+" мин"}
function fmtClock(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+pad(s%60)}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1==1)return a;return c}

function phaseInfo(p){
  const w=weeksSince(p.birth);
  const cs=p.delivery==="cs";
  let ph;
  if(w===null) ph=0;
  else if(w<(cs?8:6)) ph=0;
  else if(w<(cs?14:12)) ph=1;
  else if(w<26) ph=2;
  else ph=3;
  let capped=false;
  if(p.symptoms && p.symptoms.length && !p.symptoms.includes("none") && ph>1){ph=1;capped=true}
  if(typeof p.phaseOverride==="number") ph=p.phaseOverride;
  if(!p.cleared && ph>0 && w!==null && w>=(cs?8:6)) { /* not cleared by doctor yet */ }
  return {ph,w,cs,capped};
}
function hasDR(p){return p.dr==="yes"||p.dr==="unsure"}
function eligible(e,p,ph,w){
  if(e.ph>ph) return false;
  if(typeof e.maxPh==="number" && ph>e.maxPh) return false;
  if(e.unsafeDR && hasDR(p)) return false;
  const ww=w===null?99:w;
  if(p.delivery==="cs"){ if(e.csW && ww<e.csW) return false; }
  else { if(e.minW && ww<e.minW) return false; }
  return true;
}
function exDur(e,sets){
  sets=sets||e.sets; const sides=e.side?2:1;
  const work=e.mode==="time"?e.work:e.reps*(e.tempo||3);
  return sets*(work*sides+e.rest);
}
function seedFrom(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rotate(arr,k){if(!arr.length)return arr;k%=arr.length;return arr.slice(k).concat(arr.slice(0,k))}

/* build a workout for a given date */
function buildWorkout(dateStr){
  const p=S.profile; const {ph,w}=phaseInfo(p);
  const d=new Date(dateStr+"T00:00:00");
  const focus=FOCUS[d.getDay()];
  const budget=(p.minutes||15)*60;
  const pool=c=>EX.filter(e=>e.cat===c&&eligible(e,p,ph,w));
  const seed=seedFrom(dateStr);
  const items=[]; let total=0;
  const add=(e,block,sets)=>{const s=sets||e.sets;items.push({id:e.id,block,sets:s});total+=exDur(e,s)};
  // warm-up: breathing always; pelvic floor always in phase 0-1 or with symptoms
  add(byId.b360,"Разминка");
  const needPF=ph<=1||(p.symptoms&&p.symptoms.length&&!p.symptoms.includes("none"));
  if(needPF||focus==="core"||focus==="rest") add(byId.kegel,"Разминка");
  // cooldown chosen first so we reserve time
  const st=rotate(pool("stretch"),seed); const cool=[];
  let coolT=0;
  for(const e of st){ if(cool.length>=(budget>=1200?2:1))break; cool.push(e); coolT+=exDur(e); }
  // main blocks
  let mainCats;
  if(focus==="posture") mainCats=["posture","posture","core","posture","tone"];
  else if(focus==="core") mainCats=["core","core","posture","core","tone"];
  else if(focus==="tone") mainCats=["tone","tone","core","tone","posture"];
  else mainCats=["posture","core"];
  const pools={}; ["posture","core","tone"].forEach(c=>{
    let arr=pool(c);
    // TVA activation should lead core work in early phases
    if(c==="core"&&ph<=1){const t=arr.filter(e=>e.id==="tva");arr=t.concat(rotate(arr.filter(e=>e.id!=="tva"),seed))}
    else arr=rotate(arr,seed+c.length);
    pools[c]=arr;
  });
  const used=new Set(items.map(i=>i.id));
  const restDay=focus==="rest";
  const limit=restDay?Math.min(budget,600):budget;
  let guard=0, i=0;
  while(guard++<40){
    const c=mainCats[i%mainCats.length]; i++;
    const e=pools[c].find(x=>!used.has(x.id));
    if(!e){ if(mainCats.every(cc=>!pools[cc].some(x=>!used.has(x.id))))break; continue; }
    let sets=restDay?1:e.sets;
    const dur=exDur(e,sets);
    if(total+dur+coolT>limit+45){
      if(sets>1 && total+exDur(e,1)+coolT<=limit+45){ sets=1; } else { used.add(e.id); if(total+coolT>=limit-60)break; continue; }
    }
    used.add(e.id); add(e,"Основная часть",sets);
  }
  cool.forEach(e=>add(e,"Заминка"));
  return {focus,items,total,ph,date:dateStr};
}

  tabs.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  const head=`<header class="top"><div class="brand">Мамин тонус<small>${esc(phaseLine())}</small></div><button class="btn ghost small" id="settingsBtn">Настройки</button></header>`;
  let body="";
  if(S.tab==="today")body=viewToday();
  else if(S.tab==="plan")body=viewPlan();

function phaseLine(){const {ph,w}=phaseInfo(S.profile);return PHASES[ph].short+" · "+(w===null?"":w+" "+plural(w,"неделя","недели","недель")+" после родов")}

      <div class="ex"><div class="n">2</div><div class="t"><b>Тазовое дно — 3 раза в день</b><span>10 медленных + 10 быстрых сжатий, например во время кормления.</span></div><div class="d"></div></div>

    </div>

      <div class="row" style="flex-wrap:nowrap">
        <label class="f" for="lgWaist" style="flex:1">Талия, см<input type="number" id="lgWaist" inputmode="decimal" step="0.5" min="40" max="160" placeholder="напр. 82"></label>
        <label class="f" for="lgDr" style="flex:1">Диастаз, пальцев<input type="number" id="lgDr" inputmode="decimal" step="0.5" min="0" max="8" placeholder="напр. 2"></label>
      </div>
      <button class="btn" type="submit">Сохранить замер</button>
    </form>
  </section>
  ${log.length?`<section class="card stack"><h2>История замеров</h2><div style="overflow-x:auto"><table class="log"><thead><tr><th>Дата</th><th>Талия</th><th>Диастаз</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`:""}`;
}
function waistChart(log){
  const pts=log.filter(r=>r.waist).map(r=>({d:r.date,v:+r.waist}));
  if(pts.length<2) return `<p class="muted">${pts.length?"Нужен ещё один замер, чтобы увидеть динамику.":"Пока нет замеров. Добавьте первый ниже — через пару месяцев здесь будет видна динамика."}</p>`;
  const W=320,H=140,P={l:34,r:14,t:14,b:24};
  const vs=pts.map(p=>p.v);let mn=Math.floor(Math.min(...vs)-1),mx=Math.ceil(Math.max(...vs)+1);
  const x=i=>P.l+i*(W-P.l-P.r)/(pts.length-1), y=v=>P.t+(mx-v)*(H-P.t-P.b)/(mx-mn);
  const path=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area=path+` L${x(pts.length-1).toFixed(1)} ${H-P.b} L${P.l} ${H-P.b} Z`;
  const diff=(pts[pts.length-1].v-pts[0].v);
  return `<p><strong>${diff<=0?"−"+Math.abs(diff).toFixed(1):"+"+diff.toFixed(1)} см</strong> <span class="muted">с ${pts[0].d.split("-").reverse().join(".")}</span></p>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="График объёма талии">
   <line x1="${P.l}" x2="${W-P.r}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)"/><line x1="${P.l}" x2="${W-P.r}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--line)"/>
   <text x="${P.l-6}" y="${y(mx)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${mx}</text><text x="${P.l-6}" y="${y(mn)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${mn}</text>
   <path d="${area}" fill="var(--accent-soft)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
   ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}" fill="var(--accent)"/>`).join("")}
   <text x="${P.l}" y="${H-6}" font-size="11" fill="var(--muted)">${pts[0].d.slice(5).split("-").reverse().join(".")}</text><text x="${W-P.r}" y="${H-6}" font-size="11" text-anchor="end" fill="var(--muted)">${pts[pts.length-1].d.slice(5).split("-").reverse().join(".")}</text>
  </svg>`;
}

function viewLearn(){
  return `
  <section class="stack"><h1>Знания</h1><p class="muted">Коротко о главном. Основано на рекомендациях ACOG (2020), ВОЗ (2020) и Министерства здравоохранения Великобритании по активности после родов (2019).</p></section>
  <div class="note stop">${ICON.warn}<div><strong>Когда остановиться и обратиться к врачу</strong><ul style="margin:6px 0 0;padding-left:18px">
   <li>Кровотечение усилилось или снова стало ярко-красным</li><li>Боль, покраснение или выделения из шва (после кесарева или разрывов)</li>
   <li>Ощущение тяжести, давления или «выпадения» во влагалище</li><li>Подтекание мочи или газов при кашле, смехе, упражнениях</li>
   <li>Боль в груди, сильная одышка, головокружение, боль и отёк в икре</li><li>Боль внизу живота или в лобке, которая усиливается от упражнений</li></ul></div></div>
  <details class="k"><summary>Как проверить диастаз (самотест)</summary><div class="body">
   <p>Диастаз — расхождение прямых мышц живота по белой линии. Он есть почти у всех в конце беременности и у многих сохраняется после родов.</p>
   <ol><li>Лягте на спину, колени согнуты, стопы на полу.</li><li>Положите пальцы поперёк живота над пупком, ладонью к себе.</li><li>Слегка приподнимите голову и плечи, как будто смотрите на колени.</li><li>Почувствуйте края мышц и посчитайте, сколько пальцев помещается в щель. Проверьте также на 4 см выше и ниже пупка.</li><li>Обратите внимание на глубину: мягко ли проваливаются пальцы, или ткань упругая.</li></ol>
   <p><strong>1–2 пальца</strong> и упругая линия — норма. <strong>2,5 пальца и больше</strong>, или живот «домиком» при подъёме — диастаз; в программе тогда нет скручиваний и полных планок.</p>
   <p>Если через 6 месяцев щель не уменьшается или есть грыжа (выпячивание в пупке) — нужна консультация хирурга или реабилитолога.</p></div></details>
  <details class="k"><summary>Почему живот не уходит от качания пресса</summary><div class="body">
   <p>Живот после родов — это сочетание трёх вещей: растянутые мышцы и белая линия, ослабленная глубокая мышца живота («корсет») и жировой запас, который организм делает для кормления.</p>
   <ul><li><strong>Скручивания и подъёмы ног</strong> в первые месяцы повышают давление в животе и могут увеличить диастаз. Поэтому их нет в программе.</li>
   <li><strong>Плоский живот</strong> даёт тренировка поперечной мышцы, дыхание и тазовое дно. Именно они «стягивают» живот.</li>
   <li><strong>Локально жир не сжигается.</strong> Он уходит от общей активности, прогулок, сна и питания.</li></ul></div></details>
  <details class="k"><summary>Питание при кормлении грудью</summary><div class="body">
   <ul><li>Кормление расходует примерно 450–500 ккал в день. Жёсткие диеты снижают количество молока.</li>
   <li>Безопасный темп похудения — около 0,5 кг в неделю. Не урезайте калории в первые 6–8 недель.</li>
   <li>Белок в каждом приёме пищи: яйца, творог, курица, рыба, бобовые. Он нужен для восстановления тканей.</li>
   <li>Вода — стакан на каждое кормление.</li>
   <li>Меньше сладкого и выпечки «на бегу», больше овощей и цельных круп. Перекусы заранее: орехи, фрукты, йогурт.</li></ul></div></details>
  <details class="k"><summary>Осанка в повседневной жизни</summary><div class="body">
   <ul><li><strong>Кормление:</strong> спина на опоре, ребёнок на подушке на уровне груди, плечи опущены. Меняйте сторону.</li>
   <li><strong>Ношение ребёнка:</strong> держите ближе к центру тела, чередуйте руки, не выпячивайте бедро.</li>
   <li><strong>Подъём с пола и из кроватки:</strong> присядьте, выдохните и подтяните тазовое дно, поднимайте силой ног.</li>
   <li><strong>Автокресло и коляска:</strong> автокресло — двумя руками перед собой; ручка коляски — на уровне пояса.</li>
   <li><strong>Телефон:</strong> поднимите к глазам, не опускайте голову вниз во время кормлений.</li>
   <li><strong>Вставание с кровати</strong> (особенно после кесарева): сначала повернитесь на бок, затем оттолкнитесь руками.</li></ul></div></details>
  <details class="k"><summary>После кесарева сечения</summary><div class="body">
   <ul><li>Первые 6–8 недель: прогулки, дыхание, тазовое дно (оно тоже нагружалось во время беременности), осанка.</li>
   <li>Не поднимайте ничего тяжелее ребёнка первые 6 недель.</li>
   <li>Упражнения на четвереньках и планки — после 8–10 недель и заживления шва.</li>
   <li>Мягкий массаж вокруг рубца (после заживления, с разрешения врача) снижает спайки и онемение.</li></ul></div></details>
  <details class="k"><summary>Когда можно бегать и прыгать</summary><div class="body">
   <p>Обычно не раньше 12 недель после родов, и только если нет симптомов. Проверка готовности:</p>
   <ul><li>30 минут быстрой ходьбы без дискомфорта</li><li>10 приседаний на одной ноге с каждой стороны</li><li>20 прыжков на месте без подтекания и тяжести</li><li>Мост на одной ноге 20 раз</li></ul></div></details>
  <details class="k"><summary>Сон, гормоны и настроение</summary><div class="body">
   <ul><li>Гормон релаксин сохраняет связки мягкими до 6 месяцев после родов (дольше при кормлении). Не растягивайтесь «до упора».</li>
   <li>Недосып повышает аппетит и тягу к сладкому. Спите, когда спит ребёнок, хотя бы иногда.</li>
   <li>Пропущенная тренировка — не проблема. Лучше 10 минут через день, чем час раз в неделю.</li>
   <li>Если долго держится грусть, тревога или безразличие — это частое состояние после родов, и с ним помогает врач.</li></ul></div></details>
  <p class="muted" style="font-size:13px">Приложение не заменяет осмотр врача. Перед началом тренировок после родов получите разрешение гинеколога.</p>`;
}

/* ---------- workout player ---------- */
let P=null, wakeLock=null, actx=null;
function beep(f,len){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f||880;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(len||.15))}catch(e){}}
function buildSteps(wk){
  const steps=[];
  wk.items.forEach((it,idx)=>{const e=byId[it.id];
    const sides=e.side?["Правая сторона","Левая сторона"]:[null];
    for(let s=1;s<=it.sets;s++){
      sides.forEach((side,si)=>{
        steps.push({type:"work",e,set:s,sets:it.sets,side,idx,dur:e.mode==="time"?e.work:null});
        const lastSide=si===sides.length-1;
        if(!lastSide) steps.push({type:"rest",dur:5,label:"Смена стороны",e,idx});
        else if(s<it.sets&&e.rest) steps.push({type:"rest",dur:e.rest,label:"Отдых",e,idx});
      });
    }
    if(idx<wk.items.length-1) steps.push({type:"rest",dur:15,label:"Следующее упражнение",e:byId[wk.items[idx+1].id],idx:idx+1,nextUp:true});
  });
  return steps;
}
function startPlayer(dateStr){
  const wk=buildWorkout(dateStr);
  P={wk,steps:buildSteps(wk),i:0,left:0,running:false,t0:Date.now(),date:dateStr,tick:null,finished:false};
  P.left=P.steps[0].dur||0;
  const el=document.createElement("div"); el.className="player"; el.id="player"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-label","Тренировка");
  document.body.appendChild(el); document.body.style.overflow="hidden";
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wakeLock=l).catch(()=>{})}catch(e){}
  beep(660,.05);
  if(P.steps[0].dur) P.running=true;
  loop(); renderPlayer();
}
function loop(){clearInterval(P&&P.tick);if(!P)return;let last=Date.now();P.tick=setInterval(()=>{const now=Date.now(),dt=(now-last)/1000;last=now;
  if(!P.running||P.finished)return; const st=P.steps[P.i]; if(!st.dur)return;
  const before=Math.ceil(P.left); P.left-=dt; const after=Math.ceil(P.left);
  if(after!==before&&after<=3&&after>0)beep(520,.08);
  if(P.left<=0){next(true)}else updateTimer()},200)}
function next(auto){
  if(P.i>=P.steps.length-1){finish();return}
  P.i++; const st=P.steps[P.i]; P.left=st.dur||0; P.running=!!st.dur; beep(st.type==="work"?880:440,.15); renderPlayer();
}
function prev(){ // go to start of previous work step
  let j=P.i-1; while(j>0&&P.steps[j].type!=="work")j--; P.i=Math.max(0,j); const st=P.steps[P.i]; P.left=st.dur||0; P.running=!!st.dur; renderPlayer();
}
function finish(){
  P.finished=true;
  const mins=Math.max(1,Math.round((Date.now()-P.t0)/60000));
  S.done[P.date]={min:mins,focus:P.wk.focus}; save();
  beep(990,.25);
  const el=$("#player");
  el.className="player";
  el.innerHTML=`<div class="wrap" style="justify-content:center;text-align:center;gap:22px">
   <span class="eyebrow">Тренировка завершена</span><h1 style="font-size:30px">Готово, Рухшона! Ты молодец.</h1>
   <p class="muted">${mins} ${plural(mins,"минута","минуты","минут")} · ${esc(FOCUS_NAME[P.wk.focus])}</p>
   <div class="note sage" style="text-align:left">${ICON.check}<p>Выпей стакан воды. Если что-то тянуло или болело, загляни во «Знания» → «Когда остановиться».</p></div>
   <button class="btn block" id="pDone">Закрыть</button></div>`;
  $("#pDone").onclick=closePlayer;
}
function closePlayer(){clearInterval(P&&P.tick);P=null;const el=$("#player");if(el)el.remove();document.body.style.overflow="";try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null;render()}
function updateTimer(){const t=$("#pTime");if(t)t.textContent=fmtClock(P.left);const r=$("#pRing");if(r){const st=P.steps[P.i];const frac=st.dur?Math.max(0,P.left)/st.dur:1;r.setAttribute("stroke-dashoffset",String(628*(1-frac)))}}
function renderPlayer(){
  const el=$("#player"); if(!el||!P)return;
  const st=P.steps[P.i]; const e=st.e; const total=P.wk.items.length;
  const pct=Math.round(P.i/(P.steps.length-1)*100);
  el.className="player"+(st.type==="rest"?" rest":"");
  let center;
  if(st.type==="rest"){
    center=`<div class="stack" style="text-align:center"><span class="eyebrow">${esc(st.label)}</span>
      <div class="ring"><svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--line)" stroke-width="8"/><circle id="pRing" cx="110" cy="110" r="100" fill="none" stroke="var(--sage)" stroke-width="8" stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="0"/></svg><div class="timer" id="pTime">${fmtClock(P.left)}</div></div>
      ${st.nextUp?`<p class="muted">Далее</p><h2>${esc(e.name)}</h2>${mediaHTML(e.id,true)}`:`<p class="muted">Дышите спокойно</p>`}</div>`;
  } else {
    const amount=e.mode==="time"?`${e.work} секунд`:`${e.reps} ${plural(e.reps,"повтор","повтора","повторов")}`;
    center=`<div class="stack"><div class="row"><span class="chip accent">${esc(CAT_NAME[e.cat])}</span><span class="chip">Подход ${st.set} из ${st.sets}</span>${st.side?`<span class="chip">${esc(st.side)}</span>`:""}</div>
      <h1>${esc(e.name)}</h1><p class="muted">${esc(e.sub)}</p></div>
      ${mediaHTML(e.id)}
      ${st.dur?`<div class="ring"><svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--line)" stroke-width="8"/><circle id="pRing" cx="110" cy="110" r="100" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="0"/></svg><div class="timer" id="pTime">${fmtClock(P.left)}</div></div>`
             :`<div class="card" style="text-align:center"><div class="timer" style="font-size:56px">${e.reps}</div><p class="muted">${plural(e.reps,"повтор","повтора","повторов")}${st.side?" на эту сторону":""}, медленно</p></div>`}
      <div class="card"><ol class="cues">${e.cues.map(c=>`<li>${esc(c)}</li>`).join("")}</ol></div>`;
  }
  const mainBtn=st.dur?`<button class="btn" id="pMain">${P.running?ICON.pause+" Пауза":ICON.play+" Продолжить"}</button>`:`<button class="btn" id="pMain">${ICON.check} Сделано</button>`;
  el.innerHTML=`<div class="wrap">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="eyebrow">Упражнение ${Math.min(st.idx+1,total)} из ${total}</span><button class="icon-btn" id="pClose" aria-label="Закрыть тренировку" style="width:44px;min-height:44px">${ICON.close}</button></div>
    <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
    ${center}
    <div id="pExit" hidden class="note warn">${ICON.info}<div class="stack" style="gap:8px"><p>Закончить тренировку? Прогресс этой сессии не сохранится.</p><div class="row"><button class="btn small" id="pExitYes">Закончить</button><button class="btn ghost small" id="pExitNo">Продолжить</button></div></div></div>
    <div class="ctrl"><button class="icon-btn" id="pPrev" aria-label="Назад">${ICON.prev}</button>${mainBtn}<button class="icon-btn" id="pNext" aria-label="Пропустить">${ICON.next}</button></div>
  </div>`;
  updateTimer();
  $("#pMain").onclick=()=>{ if(st.dur){P.running=!P.running;renderPlayer()} else next() };
  $("#pNext").onclick=()=>next();
  $("#pPrev").onclick=prev;
  $("#pClose").onclick=()=>{$("#pExit").hidden=false;P.running=false;};
  $("#pExitNo").onclick=()=>{$("#pExit").hidden=true;if(P.steps[P.i].dur)P.running=true;};
  $("#pExitYes").onclick=closePlayer;
}
